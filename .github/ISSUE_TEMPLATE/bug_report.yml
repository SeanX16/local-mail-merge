name: 公司电脑测试问题
description: 报告 Local Mail Merge 在 Windows/Outlook 测试中的可复现问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请不要上传真实收件人、邮件正文、Outlook 账户、审计报告或未脱敏截图。
  - type: input
    id: release
    attributes:
      label: Release 版本
      placeholder: v0.1.0-alpha
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows、屏幕缩放与 Outlook 版本
      placeholder: Windows 11 23H2 / 150% / 经典 Outlook 2406
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 启动或公司安全策略
        - Outlook 账户检测
        - Excel/JSON/CSV 导入
        - 列筛选、选择或邮件预览
        - 模板与签名
        - 草稿创建或去重
        - 界面尺寸或显示
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最少复现步骤
      description: 只使用虚构或已脱敏的数据描述。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与已脱敏错误文案
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认本 Issue 不包含真实人才名单、邮箱、邮件正文、Outlook 账户或未脱敏截图。
          required: true
